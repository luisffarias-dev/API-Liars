<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste Liar's Bar Jokenpo</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; background: #222; color: #fff; }
        input, button { padding: 10px; margin: 5px; border-radius: 5px; border: none; }
        button { background: #3498db; color: white; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #2980b9; }
        button:disabled { background: #555 !important; color: #888 !important; cursor: not-allowed; }
        .danger { background: #e74c3c; }
        .danger:hover { background: #c0392b; }
        .warning { background: #f1c40f; color: black; }
        .warning:hover { background: #d4ac0d; }
        .success { background: #2ecc71; color: black; }
        .success:hover { background: #27ae60; }
        .purple { background: #9b59b6; }
        .purple:hover { background: #8e44ad; }
        #console { background: #111; padding: 15px; height: 250px; overflow-y: scroll; font-family: monospace; color: #0f0; border: 1px solid #444; }
        .panel { background: #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        
        .card-label {
            display: inline-block;
            background: #555;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            font-weight: bold;
        }
        .card-label:hover { background: #666; }
        input[type="checkbox"]:checked + span { color: #2ecc71; }
        
        /* BANNER DE TURNO */
        #turnBanner {
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            background: #444;
            margin-bottom: 15px;
            transition: 0.3s background;
        }
    </style>
</head>
<body>
    <h2>🤖 Painel de Teste - Liar's Jokenpo</h2>
    
    <div class="panel" style="border-left: 5px solid #9b59b6;">
        <h4 style="margin-top: 0;">🔑 Login Rápido:</h4>
        <input id="email" type="email" placeholder="E-mail de teste" value="teste1@teste.com">
        <input id="password" type="password" placeholder="Senha" value="123456">
        <button onclick="fazerLoginEConectar()" class="purple">Fazer Login & Conectar</button>
        <br><br>
        <small style="color: #aaa;">Ou conecte manualmente com o token:</small><br>
        <input id="token" placeholder="Cole seu JWT Token aqui" style="width: 300px; margin-top: 5px;">
        <button onclick="conectar()">Conectar Manual</button>
    </div>

    <div class="panel">
        <button onclick="buscarPartida()" class="success">🔍 Entrar na Fila de Partida</button>
        <input id="matchId" placeholder="ID da Partida (Preenche automático)" style="width: 300px;" readonly>
    </div>

    <div class="panel">
        <div id="turnBanner">Aguardando partida começar...</div>

        <h4 style="margin-top: 0; margin-bottom: 5px;">🃏 Sua Mão:</h4>
        <div id="handContainer" style="background: #222; padding: 15px; border-radius: 5px; min-height: 40px; margin-bottom: 15px;">
            <i>Aguardando cartas do servidor...</i>
        </div>
        
        <button id="btnPlay" onclick="jogarCarta()" disabled>Jogar Carta(s) Selecionada(s)</button>
        <button id="btnDuvidar" onclick="duvidar()" class="warning" disabled>DUVIDAR! (Mentira)</button>
    </div>

    <div class="panel" style="border-left: 5px solid #e74c3c;">
        <h4 style="margin-top: 0;">💥 Responder Duelo de Punição:</h4>
        <button onclick="jogarPunicao('ROCK')" class="danger">🪨 ROCK</button>
        <button onclick="jogarPunicao('PAPER')" class="danger">📄 PAPER</button>
        <button onclick="jogarPunicao('SCISSORS')" class="danger">✂️ SCISSORS</button>
    </div>

    <h3>Logs do Servidor:</h3>
    <div id="console"></div>

    <script>
        let socket;
        let myCards = []; 
        let myUserId = ''; // Guardará o ID deste HTML
        let isMyTurn = false; // Controle de bloqueio
        
        function log(msg, data = '') {
            const painel = document.getElementById('console');
            const dataString = typeof data === 'object' ? JSON.stringify(data) : data;
            painel.innerHTML += `<p>> ${msg} <span style="color: #fff;">${dataString}</span></p>`;
            painel.scrollTop = painel.scrollHeight;
        }

        // --- FUNÇÃO PARA DESCOBRIR SEU PRÓPRIO ID LENDO O TOKEN ---
        function extrairUserIdDoToken(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(c => 
                    '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
                ).join(''));
                const payload = JSON.parse(jsonPayload);
                return payload.sub; // No NestJS JWT, o 'sub' geralmente guarda o ID do usuário
            } catch (e) {
                log('⚠️ Erro ao ler Token JWT. Talvez o ID da vez não sincronize.');
                return '';
            }
        }

        async function fazerLoginEConectar() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            log(`⏳ Tentando fazer login com ${email}...`);

            try {
                const response = await fetch('https://api-liars.onrender.com/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (!response.ok) throw new Error('Falha no login. Verifique as credenciais.');
                const data = await response.json();
                const token = data.access_token || data.token; 

                if (token) {
                    document.getElementById('token').value = token;
                    log('✅ Login realizado com sucesso! Conectando socket...');
                    conectar();
                }
            } catch (error) {
                log('❌ ERRO HTTP:', error.message);
            }
        }

        function renderHand() {
            const container = document.getElementById('handContainer');
            container.innerHTML = ''; 
            
            if (myCards.length === 0) {
                container.innerHTML = '<i style="color: #888;">Você não tem mais cartas!</i>';
                return;
            }

            myCards.forEach((card, index) => {
                let emoji = card === 'ROCK' ? '🪨' : card === 'PAPER' ? '📄' : card === 'SCISSORS' ? '✂️' : '🎭';
                container.innerHTML += `
                    <label class="card-label">
                        <input type="checkbox" name="cardOption" value="${card}" data-index="${index}" ${isMyTurn ? '' : 'disabled'} style="cursor: pointer;"> 
                        <span>${emoji} ${card}</span>
                    </label>
                `;
            });
        }

        function conectar() {
            const token = document.getElementById('token').value;
            if (!token) return alert('Token vazio!');

            // Extrai o ID do usuário para saber de quem é a vez
            myUserId = extrairUserIdDoToken(token);

            socket = io('https://api-liars.onrender.com', {
                auth: { token: token }
            });

            socket.on('connect', () => log('✅ Conectado ao Servidor Socket!'));
            
            socket.on('game_ready', (data) => {
                log('🎮 PARTIDA COMEÇOU!', data.message);
                document.getElementById('matchId').value = data.matchId;
                setTimeout(() => socket.emit('reconnect_match'), 500);
            });

            socket.on('game_state_recovered', (data) => {
                if(data.myCards) myCards = data.myCards;
                atualizarTurnoUI(data.currentTurnPlayerId, data.currentTurnPlayerNickname, data.roundCard);
            });
            
            socket.on('your_hand', (data) => {
                myCards = data.cards;
                renderHand();
            });

            socket.on('new_round_cards', (data) => {
                log('🔄 NOVA RODADA: Cartas redistribuídas!', data.myCards);
                myCards = data.myCards || [];
                renderHand();
            });
            
            // Lógica visual do turno
            socket.on('turn_start', (data) => {
                log(`⏱️ TURNO DE: ${data.currentPlayerNickname} | PEDE: ${data.roundCard}`);
                atualizarTurnoUI(data.currentPlayerId, data.currentPlayerNickname, data.roundCard);
            });
            
            socket.on('challenge_result', (data) => {
                log('🚨 RESULTADO DO DESAFIO:', data.message);
                document.getElementById('turnBanner').innerText = "💥 AVALIANDO MENTIRA...";
                document.getElementById('turnBanner').style.background = "#e74c3c";
                travarBotoes(true);
            });
            
            socket.on('start_penalty_duel', (data) => log('💀 DUELO DA MORTE INICIADO PARA:', data.loserId));
            
            // Lógica de resultado e eliminação local
            socket.on('penalty_result', (data) => {
                log('🎲 RESULTADO PUNIÇÃO:', data.message);
                
                // Se for este usuário e ele tiver sido eliminado
                if (data.userId === myUserId && data.isEliminated) {
                    alert("💀 VOCÊ FOI ELIMINADO! Retornando ao menu...");
                    
                    // Limpa a tela localmente para simular o 'kick' do servidor
                    document.getElementById('matchId').value = '';
                    const banner = document.getElementById('turnBanner');
                    banner.innerText = "Você foi desconectado da mesa.";
                    banner.style.background = "#e74c3c";
                    banner.style.color = "#fff";
                    
                    myCards = [];
                    renderHand();
                    travarBotoes(true);
                }
            });
            
            socket.on('game_over', (data) => log('🏆 FIM DE JOGO:', data.message));
        }

        // --- ATUALIZA A TELA DEPENDENDO DE QUEM É A VEZ ---
        function atualizarTurnoUI(turnId, turnNickname, roundCard) {
            const banner = document.getElementById('turnBanner');
            isMyTurn = (turnId === myUserId);

            if (isMyTurn) {
                banner.innerText = `🟢 SUA VEZ! A mesa pede: ${roundCard}`;
                banner.style.background = '#2ecc71';
                banner.style.color = '#000';
                travarBotoes(false);
            } else {
                banner.innerText = `⏳ Vez de: ${turnNickname || 'Oponente'}. A mesa pede: ${roundCard}`;
                banner.style.background = '#e67e22';
                banner.style.color = '#fff';
                travarBotoes(true);
            }
            renderHand(); // Re-renderiza para ativar/desativar as checkboxes
        }

        function travarBotoes(travar) {
            document.getElementById('btnPlay').disabled = travar;
            document.getElementById('btnDuvidar').disabled = travar;
        }

        function buscarPartida() { socket.emit('find_match'); }
        
        function jogarCarta() {
            if(!isMyTurn) return;
            const matchId = document.getElementById('matchId').value;
            const checkboxes = document.querySelectorAll('input[name="cardOption"]:checked');
            
            if (checkboxes.length === 0) return alert('Selecione uma carta!');

            const cardsArray = Array.from(checkboxes).map(cb => cb.value);
            const indexesToRemove = Array.from(checkboxes).map(cb => parseInt(cb.getAttribute('data-index')));

            socket.emit('play_card', { matchId: matchId, cardsPlayed: cardsArray });
            
            indexesToRemove.sort((a, b) => b - a).forEach(idx => myCards.splice(idx, 1));
            travarBotoes(true); // Trava instantaneamente pra não clicar 2x
            renderHand(); 
        }

        function duvidar() {
            if(!isMyTurn) return;
            socket.emit('challenge', { matchId: document.getElementById('matchId').value });
            travarBotoes(true);
        }

        function jogarPunicao(choice) {
            socket.emit('play_penalty', { 
                matchId: document.getElementById('matchId').value,
                choice: choice
            });
        }
    </script>
</body>
</html>
